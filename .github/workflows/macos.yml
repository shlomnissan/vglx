name: MacOS
on: [push]
jobs:
  build:
    runs-on: macos-26
    permissions:
      id-token: write
      pages: write
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          brew update
          brew install doxygen
      - name: Configure
        shell: bash
        run: cmake -B ${{github.workspace}}/build --preset="development" -G "Ninja" -D VGLX_BUILD_DOCS=1
      - name: Build
        shell: bash
        run: cmake --build ${{github.workspace}}/build
      - name: Test
        shell: bash
        run: |
          cd ${{github.workspace}}/build
          ctest -V
      - name: Configure (Vulkan)
        shell: bash
        run: cmake -B ${{github.workspace}}/build-vulkan --preset="development" -G "Ninja" -D VGLX_EXPERIMENTAL_VULKAN=ON
      - name: Build (Vulkan)
        shell: bash
        run: cmake --build ${{github.workspace}}/build-vulkan
      - name: Generate Documentation
        shell: bash
        run: ${{github.workspace}}/scripts/gendocs.sh
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ github.workspace }}/docs/package-lock.json
      - name: Build VitePress site
        working-directory: ${{ github.workspace }}/docs
        run: npm ci && npm run build
      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ github.workspace }}/docs/.vitepress/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5